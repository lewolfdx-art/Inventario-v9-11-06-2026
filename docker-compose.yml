# ============================================================
# ENTORNO DE DESARROLLO  (D:\Inventario-v9)
# - Proyecto Docker: inventario-dev   (no colisiona con el cliente)
# - Puertos: app 8080 | phpMyAdmin 8081 | MySQL 3307
# - Monta tu codigo en vivo (bind mount): editas y se ve al instante,
#   sin necesidad de reconstruir la imagen.
# - Comparte la MISMA base de datos que el entorno cliente (volumen
#   "inventario_dbdata"). Corre SOLO un entorno a la vez.
# ============================================================
name: inventario-dev

services:
  app:
    build: .
    ports:
      - "8080:80"
    volumes:
      # Codigo montado en vivo (los cambios se reflejan sin rebuild)
      - ./app:/var/www/html/app
      - ./config:/var/www/html/config
      - ./database:/var/www/html/database
      - ./resources:/var/www/html/resources
      - ./routes:/var/www/html/routes
      - ./lang:/var/www/html/lang
      # Formatos/auxiliares (Excel, instrucciones, plantillas)
      - ./scripts:/var/www/html/scripts
      # Persistencia
      - ./storage:/var/www/html/storage
      # Impresión USB mediante CUPS del host (servidor Linux).
      # Descomenta en el servidor donde esté enchufada la Zebra por USB:
      # - /var/run/cups/cups.sock:/var/run/cups/cups.sock
    env_file:
      - .env
    environment:
      # Apunta al socket CUPS del host (necesario al montarlo arriba):
      # CUPS_SERVER: /var/run/cups/cups.sock
      ZPL_DRIVER: ${ZPL_DRIVER:-cups}
      ZPL_PRINTER_QUEUE: ${ZPL_PRINTER_QUEUE:-Zebra}
    depends_on:
      - db
    networks:
      - inventario_dev_net
    restart: unless-stopped

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: inventorio_v9
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3307:3306"
    networks:
      - inventario_dev_net
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:latest
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: secret
    ports:
      - "8081:80"
    depends_on:
      - db
    networks:
      - inventario_dev_net
    restart: unless-stopped

networks:
  inventario_dev_net:
    driver: bridge

volumes:
  # Volumen externo ya creado (misma BD compartida con el entorno cliente).
  # Crear una sola vez con:  docker volume create inventario_dbdata
  db_data:
    external: true
    name: inventario_dbdata
