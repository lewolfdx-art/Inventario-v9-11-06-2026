; ----------------------
; PHP Desktop - Configuración optimizada para Laravel
; ----------------------

[PHP]

; Extensions necesarias para Laravel
extension_dir = "ext/"
extension=php_curl.dll
extension=php_fileinfo.dll       ; Necesario para Laravel (validación de archivos)
extension=php_mbstring.dll        ; SUPER importante para Laravel (cadenas multibyte)
extension=php_openssl.dll
extension=php_pdo_sqlite.dll
extension=php_sqlite3.dll
extension=php_tokenizer.dll       ; Necesario para Laravel (análisis de código)
extension=php_gd.dll              ; Imágenes (PHP 8.2 usa php_gd.dll)
extension=php_xsl.dll             ; XML (PHP 8.2 usa php_xsl.dll)
extension=php_intl.dll            ; ⚠️ IMPORTANTE: Necesario para Laravel (formato de números)

; Las de MySQL/PostgreSQL las dejamos por si acaso, pero no son necesarias con SQLite
;extension=php_mysql.dll
extension=php_mysqli.dll
extension=php_pdo_mysql.dll
extension=php_pdo_pgsql.dll
extension=php_pgsql.dll
extension=php_com_dotnet.dll

; Zona horaria (Perú)
date.timezone = America/Lima

; Mostrar errores (muy útil mientras pruebas)
error_reporting = E_ALL
display_errors = On
display_startup_errors = On
log_errors = On
error_log = "debug.log"           ; Guarda errores en un archivo en la carpeta principal

; Configuración general recomendada para Laravel
short_open_tag = On
output_buffering = Off
default_charset = "UTF-8"
zlib.output_compression = Off
implicit_flush = Off
ignore_user_abort = Off

; Memoria y tiempo de ejecución (Laravel necesita un poco más)
memory_limit = 512M
max_execution_time = 300

; Subida de archivos (ajusta según necesites)
max_file_uploads = 20
upload_max_filesize = 50M
post_max_size = 50M

; SMTP (no incluido en PHP Desktop, pero por si lo usas con mail falso)
SMTP = 127.0.0.1
smtp_port = 25

; Otras configuraciones útiles
expose_php = Off
allow_url_fopen = On